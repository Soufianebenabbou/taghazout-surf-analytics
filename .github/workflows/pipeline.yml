name: Pipeline Taghazout

# Declenchement : chaque jour a 6h UTC, ou manuellement
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      # Recupere le code du depot
      - uses: actions/checkout@v4

      # Installe Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installe les bibliotheques necessaires
      - name: Installer les dependances
        run: pip install -r requirements.txt

      # Ecrit la cle de service dans un fichier temporaire, hors du depot.
      # Le secret n'apparait jamais dans les logs : GitHub le masque.
      - name: Authentification Google Cloud
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > "${RUNNER_TEMP}/cle.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/cle.json" >> "$GITHUB_ENV"

      # Lance la collecte puis la transformation.
      # DBT_TARGET=prod bascule dbt sur le compte de service et le dataset
      # de production ; en local, la variable est absente et dbt reste en dev.
      - name: Executer le pipeline
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          DBT_PROFILES_DIR: transformation/taghazout_transform
          DBT_TARGET: prod
        run: python pipeline.py

      # La cle ne doit pas survivre au job, meme en cas d'echec.
      - name: Supprimer la cle
        if: always()
        run: rm -f "${RUNNER_TEMP}/cle.json"
