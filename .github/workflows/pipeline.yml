name: Pipeline Taghazout

# Declenchement : chaque jour a 6h UTC, ou manuellement
#
# LIMITE CONNUE
# -------------
# Open-Meteo limite ses appels PAR ADRESSE IP, pas par projet. Les runners
# GitHub partagent leurs adresses avec des milliers d'autres jobs : certains
# matins le quota de l'adresse tiree est deja epuise par d'autres, et l'appel
# aux previsions repond par un ReadTimeout. Le pipeline echoue alors, sans
# que ce soit un defaut du code.
#
# Attenuation en place : les reessais attendent une minute, puis trois, puis
# cinq (voir ATTENTES_ENTRE_TENTATIVES_S dans collecte/collecte.py). Cela
# suffit si la limite se recharge a la minute. Si l'adresse est bloquee pour
# l'heure, l'execution du jour echoue -- l'adresse ne change pas pendant un
# job.
#
# Dans ce cas, test_previsions_fraiches signale le retard des le lendemain :
# la panne ne passe pas inapercue. Relancer le workflow a la main suffit en
# general, la nouvelle execution tirant une autre adresse.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      # Recupere le code du depot
      - uses: actions/checkout@v4

      # Installe Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installe les bibliotheques necessaires
      - name: Installer les dependances
        run: pip install -r requirements.txt

      # Ecrit la cle de service dans un fichier temporaire, hors du depot.
      # Le secret n'apparait jamais dans les logs : GitHub le masque.
      - name: Authentification Google Cloud
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > "${RUNNER_TEMP}/cle.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/cle.json" >> "$GITHUB_ENV"

      # Lance la collecte puis la transformation.
      # DBT_TARGET=prod bascule dbt sur le compte de service et le dataset
      # de production ; en local, la variable est absente et dbt reste en dev.
      - name: Executer le pipeline
        env:
          # L'identifiant du projet n'est pas un secret : il figure deja en
          # clair dans sources.yml, dans profiles.yml et dans toute URL de la
          # console GCP. Seule la cle de service en est un.
          GCP_PROJECT_ID: taghazout-surf
          DBT_PROFILES_DIR: transformation/taghazout_transform
          DBT_TARGET: prod
        run: python pipeline.py

      # La cle ne doit pas survivre au job, meme en cas d'echec.
      - name: Supprimer la cle
        if: always()
        run: rm -f "${RUNNER_TEMP}/cle.json"
