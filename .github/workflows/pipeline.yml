name: Pipeline Taghazout

# Déclenchement : chaque jour à 6h UTC, ou manuellement
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      # Récupère le code du dépôt
      - uses: actions/checkout@v4

      # Installe Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installe les bibliothèques nécessaires
      - name: Installer les dépendances
        run: pip install requests pandas pandas-gbq dbt-bigquery python-dotenv

      # Écrit la clé de service dans un fichier temporaire
      - name: Authentification Google Cloud
        run: echo '${{ secrets.GCP_SA_KEY }}' > /tmp/cle.json

      # Lance la collecte et la transformation
      - name: Exécuter le pipeline
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/cle.json
        run: python pipeline.py