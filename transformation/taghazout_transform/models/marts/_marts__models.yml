version: 2

models:
  - name: fct_conditions_horaires
    description: >
      Table de faits : une ligne par heure d'historique, avec trois scores de
      surf sur 10 -- un par niveau de pratique. Les barèmes vivent dans la
      macro scores_par_niveau, partagee avec mart_previsions_notees. Les trois
      scores tombent a 0 en dehors des heures de jour.
    columns:

      - name: horodatage
        description: Heure de la mesure. Cle primaire de la table.
        tests:
          - not_null
          - unique

      - name: score_surf
        description: >
          Score du surfeur intermediaire, de 0 a 10. Somme de points_taille
          (0-4), points_periode (0-3) et points_vent (0-3), forcee a 0 entre
          20h et 5h. C'est le score historique du projet, conserve sous ce
          nom ; score_intermediaire en est la copie dans les marts.
        tests:
          - not_null

      - name: score_debutant
        description: >
          Score du surfeur debutant, de 0 a 10. Recompense les vagues de 0,5 a
          1,0 m, le vent faible et les houles COURTES : une houle longue est
          puissante, donc un danger a ce niveau.
        tests:
          - not_null

      - name: score_confirme
        description: >
          Score du surfeur confirme, de 0 a 10. Recompense les vagues de plus
          de 1,8 m et les houles longues ; tolere un vent plus fort.
        tests:
          - not_null

      - name: niveau_favorise
        description: >
          Niveau qui obtient le meilleur score sur cette heure. En cas
          d'egalite, le niveau le plus accessible l'emporte : une heure
          egalement bonne pour tous est d'abord une heure pour tous.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Débutant", "Intermédiaire", "Confirmé", "Nuit"]

      - name: points_taille
        description: Points attribues a la hauteur de vague, de 0 a 4.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4]
                # quote: false -> comparer des entiers, pas du texte
                quote: false

      - name: points_periode
        description: Points attribues a la periode de houle, de 0 a 3.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3]
                # quote: false -> comparer des entiers, pas du texte
                quote: false

      - name: points_vent
        description: Points attribues au vent, de 0 a 3.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3]
                # quote: false -> comparer des entiers, pas du texte
                quote: false

  - name: dim_temps
    description: >
      Dimension temps : une ligne par jour couvert par l'historique. Porte
      les libelles en francais et la distinction entre saison de surf et
      saison balneaire.
    columns:

      - name: jour
        description: Date. Cle primaire de la dimension.
        tests:
          - not_null
          - unique

      - name: nom_mois
        description: Nom du mois en francais.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin",
                   "Juillet", "Août", "Septembre", "Octobre", "Novembre",
                   "Décembre"]

      - name: saison
        description: Saison meteorologique.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Hiver", "Printemps", "Été", "Automne"]

      - name: saison_usage
        description: >
          Saison d'usage de Taghazout. Les meilleures conditions de surf
          tombent en hiver, la frequentation balneaire en ete : les deux ne
          se recouvrent pas, et c'est le resultat principal de l'analyse.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Saison surf", "Saison balnéaire", "Intersaison"]

      - name: est_weekend
        description: Vrai le samedi et le dimanche.
        tests:
          - not_null

  - name: mart_fenetres_horaires
    description: >
      Qualite moyenne des conditions, croisee par mois et par heure.
      Repond a la question : quand faut-il se mettre a l'eau ?
      Grain : une ligne par couple mois x heure, soit 288 lignes.
    columns:

      - name: nom_mois
        description: >
          Nom du mois en francais, pour l'affichage. La colonne `mois` reste
          disponible a cote pour le tri.
        tests:
          - not_null

      - name: score_moyen
        description: Score de surf moyen sur le creneau.
        tests:
          - not_null

      - name: pct_offshore
        description: Part des heures ou le vent vient de la terre, en pourcentage.
        tests:
          - not_null

  - name: mart_saisonnalite_mensuelle
    description: >
      Agregat mensuel des conditions. Grain : une ligne par mois,
      soit 12 lignes. Les indicateurs de qualite de surf (score, pourcentages)
      sont calcules sur les heures de jour uniquement ; les conditions
      physiques (houle, temperatures, pluie) sur les 24 heures.
    columns:

      - name: mois
        description: Numero du mois, de 1 a 12. Cle primaire et cle de tri.
        tests:
          - not_null
          - unique

      - name: heures_jour
        description: >
          Nombre d'heures de jour du mois (6h-19h). Denominateur de tous les
          pourcentages de la table, expose pour qu'il soit verifiable.
        tests:
          - not_null

      - name: score_moyen
        description: >
          Score de surf moyen du mois, sur les heures de jour uniquement.
          Identique a score_intermediaire ; conserve pour compatibilite.
        tests:
          - not_null

      - name: score_debutant
        description: >
          Score moyen du mois pour un surfeur debutant, heures de jour
          uniquement. Les trois scores de niveau sont sur 10 : ils se
          comparent directement sur un meme graphique.
        tests:
          - not_null

      - name: score_intermediaire
        description: >
          Score moyen du mois pour un surfeur intermediaire, heures de jour
          uniquement.
        tests:
          - not_null

      - name: score_confirme
        description: >
          Score moyen du mois pour un surfeur confirme, heures de jour
          uniquement.
        tests:
          - not_null

      - name: nom_mois
        description: >
          Nom du mois en francais, pour l'affichage. La colonne `mois` reste
          disponible a cote pour le tri.
        tests:
          - not_null

  - name: mart_previsions_notees
    description: >
      Previsions a 7 jours, notees avec le meme bareme que l'historique.
      Grain : une ligne par heure prevue, soit 168 lignes.
    columns:

      - name: horodatage
        description: Heure prevue. Cle primaire de la table.
        tests:
          - not_null
          - unique

      - name: score_surf
        description: Note de 0 a 10, calculee comme pour l'historique.
        tests:
          - not_null
